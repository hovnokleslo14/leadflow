name: Build & Push Docker Image

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # manual trigger

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=LeadFlow Dashboard
            org.opencontainers.image.description=Moderní CRM pro Minecraft vývojáře
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.vendor=${{ github.actor }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Generate artifact attestation
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ──────────────────────────────────────────────────────────────────
  # Test the built image
  # ──────────────────────────────────────────────────────────────────
  test:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Pull built image
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Test health endpoint
        run: |
          docker run -d --name leadflow-test \
            -e DATABASE_URL=sqlite+aiosqlite:///./test.db \
            -e SECRET_KEY=test-secret-key-for-testing-only \
            -e ADMIN_USERNAME=admin \
            -p 8080:8080 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          
          # Wait for startup
          for i in {1..30}; do
            if curl -f http://localhost:8080/api/health 2>/dev/null; then
              echo "Health check passed"
              break
            fi
            sleep 2
          done
          
          docker logs leadflow-test
          docker stop leadflow-test
          docker rm leadflow-test

  # ──────────────────────────────────────────────────────────────────
  # Deploy to Pelican (optional - requires Pelican API token)
  # ──────────────────────────────────────────────────────────────────
  deploy-pelican:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Deploy to Pelican
        if: ${{ secrets.PELICAN_API_TOKEN != '' }}
        run: |
          echo "Deploying to Pelican..."
          # Example using Pelican API (adjust for your setup)
          curl -X POST "https://panel.tvoje-domena.cz/api/application/servers/${{ secrets.PELICAN_SERVER_ID }}/rebuild" \
            -H "Authorization: Bearer ${{ secrets.PELICAN_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"image": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"}'