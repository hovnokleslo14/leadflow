version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: leadflow-postgres-dev
    environment:
      POSTGRES_DB: leadflow
      POSTGRES_USER: leadflow
      POSTGRES_PASSWORD: leadflow
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - leadflow-dev-network

  redis:
    image: redis:7-alpine
    container_name: leadflow-redis-dev
    ports:
      - "6380:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - leadflow-dev-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: leadflow-backend-dev
    environment:
      - DATABASE_URL=postgresql+asyncpg://leadflow:leadflow@postgres:5432/leadflow
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production-min-32-chars
      - ADMIN_USERNAME=admin
      - DEBUG=true
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app
      - /app/__pycache__
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    networks:
      - leadflow-dev-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: leadflow-celery-worker-dev
    command: celery -A app.celery_app worker --loglevel=info --concurrency=2
    environment:
      - DATABASE_URL=postgresql+asyncpg://leadflow:leadflow@postgres:5432/leadflow
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=dev-secret-key-change-in-production-min-32-chars
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
      - backend
    networks:
      - leadflow-dev-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: base
    container_name: leadflow-frontend-dev
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - leadflow-dev-network
    command: npm run dev

volumes:
  postgres_dev_data:
  redis_dev_data:

networks:
  leadflow-dev-network:
    driver: bridge