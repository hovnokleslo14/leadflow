# Supervisor config for Pelican - runs nginx + frontend + backend
[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
logfile_backups=5
loglevel=info
pidfile=/run/supervisord.pid
user=root

# ──────────────────────────────────────────────────────────────────
# NGINX (reverse proxy on :8080)
# ──────────────────────────────────────────────────────────────────
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=3
startretries=3
stdout_logfile=/var/log/supervisor/nginx_stdout.log
stderr_logfile=/var/log/supervisor/nginx_stderr.log
redirect_stderr=true

# ──────────────────────────────────────────────────────────────────
# FRONTEND (Next.js standalone server on :3000)
# ──────────────────────────────────────────────────────────────────
[program:frontend]
command=node server.js
directory=/app/frontend
autostart=true
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/var/log/supervisor/frontend_stdout.log
stderr_logfile=/var/log/supervisor/frontend_stderr.log
redirect_stderr=true
environment=NODE_ENV=production,PORT=3000,HOSTNAME=0.0.0.0
user=appuser

# ──────────────────────────────────────────────────────────────────
# BACKEND (FastAPI on :8000)
# ──────────────────────────────────────────────────────────────────
[program:backend]
command=gunicorn app.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 127.0.0.1:8000 --timeout 120 --keep-alive 5 --access-logfile - --error-logfile - --log-level info
directory=/app/backend
autostart=true
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/var/log/supervisor/backend_stdout.log
stderr_logfile=/var/log/supervisor/backend_stderr.log
redirect_stderr=true
environment=PYTHONUNBUFFERED=1
user=appuser

# ──────────────────────────────────────────────────────────────────
# CELERY WORKER (background tasks)
# ──────────────────────────────────────────────────────────────────
[program:celery-worker]
command=celery -A app.celery_app worker --loglevel=info --concurrency=2
directory=/app/backend
autostart=true
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/var/log/supervisor/celery_worker_stdout.log
stderr_logfile=/var/log/supervisor/celery_worker_stderr.log
redirect_stderr=true
environment=PYTHONUNBUFFERED=1
user=appuser

# ──────────────────────────────────────────────────────────────────
# CELERY BEAT (scheduler)
# ──────────────────────────────────────────────────────────────────
[program:celery-beat]
command=celery -A app.celery_app beat --loglevel=info --scheduler celery.beat.PersistentScheduler
directory=/app/backend
autostart=true
autorestart=true
startsecs=5
startretries=3
stdout_logfile=/var/log/supervisor/celery_beat_stdout.log
stderr_logfile=/var/log/supervisor/celery_beat_stderr.log
redirect_stderr=true
environment=PYTHONUNBUFFERED=1
user=appuser